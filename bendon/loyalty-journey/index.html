<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
        <title>Bra Better Rewards Journey</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="no-cache" />
        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>

            :root {
                --t1:rgba(255,255,255,0.96); --t2:rgba(255,255,255,0.60); --t3:rgba(255,255,255,0.38);
                --line:rgba(255,255,255,0.09);
                --font-sans:'Duplet',-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
                --ease-out:cubic-bezier(0.16,1,0.3,1);
            }
            * { box-sizing:border-box; }
            .staticrypt-html, .staticrypt-body { background:#000; }
            .staticrypt-content {
                margin:0; height:100%;
                font-family:var(--font-sans); font-weight:300; color:var(--t2);
                background:#000;
                background-image:
                    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(157,162,179,0.16), transparent 60%),
                    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(110,113,128,0.10), transparent 60%),
                    linear-gradient(180deg,#0B0B0C 0%,#000 100%);
                background-attachment:fixed;
                -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            }
            .staticrypt-page {
                width:auto; min-height:100%; padding:24px;
                display:flex; align-items:center; justify-content:center;
            }
            .staticrypt-form {
                position:relative; z-index:1; width:100%; max-width:404px;
                margin:0; padding:44px 40px 40px; text-align:center;
                background:rgba(255,255,255,0.02); border:1px solid var(--line);
                border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,0.55);
                -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
            }
            .sc-lockup { display:flex; align-items:center; justify-content:center; gap:17px; margin:0 auto 24px; }
            .sc-logo { height:21px; width:auto; display:block; margin:0; filter:brightness(0) invert(1); }
            .sc-client { height:25px; filter:brightness(0) invert(1); }
            .sc-x { font-family:var(--font-sans); font-size:15px; font-weight:500;
                color:rgba(255,255,255,0.38); line-height:1; }
            .sc-eyebrow {
                display:inline-block; font-size:11px; font-weight:600; letter-spacing:0.16em;
                text-transform:uppercase; color:var(--t2); margin-bottom:18px;
                padding:7px 14px; border:1px solid var(--line); border-radius:999px;
                background:rgba(255,255,255,0.035);
            }
            .sc-instructions { font-size:14px; color:var(--t2); line-height:1.55; margin:0 0 26px; }
            .staticrypt-hr { display:none; }
            .staticrypt-password-container {
                position:relative; width:100%; margin:0 0 14px;
                background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px;
                transition:border-color .2s var(--ease-out), background .2s var(--ease-out);
            }
            .staticrypt-password-container:focus-within {
                border-color:rgba(255,255,255,0.30); background:rgba(255,255,255,0.05);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background:transparent; border:0; outline:0; width:100%;
                font-family:var(--font-sans); font-weight:300; color:var(--t1);
                font-size:15px; padding:15px 46px 15px 16px; border-radius:10px; text-align:left;
            }
            .staticrypt-form input::placeholder { color:var(--t3); }
            .staticrypt-toggle-password-visibility {
                cursor:pointer; height:18px; width:18px; padding:14px; box-sizing:content-box;
                position:absolute; right:2px; top:50%; transform:translateY(-50%);
                filter:invert(1); opacity:0.42;
            }
            .staticrypt-toggle-password-visibility:hover { opacity:0.85; }
            label.staticrypt-remember {
                display:flex; align-items:center; gap:10px; margin:0 0 22px;
                font-size:13px; color:var(--t2); cursor:pointer; -webkit-user-select:none; user-select:none;
            }
            .staticrypt-remember input[type="checkbox"] {
                width:15px; height:15px; transform:none; margin:0; accent-color:#fff; cursor:pointer;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                font-family:var(--font-sans); font-weight:600; text-transform:none;
                outline:0; cursor:pointer; background:#fff; color:#000; width:100%;
                border:0; border-radius:999px; padding:14px; font-size:14px; letter-spacing:0.01em;
                transition:filter .2s var(--ease-out), transform .1s var(--ease-out);
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { background:#fff; filter:brightness(0.9); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform:translateY(1px); }
            .staticrypt-spinner-container {
                background:#000; background-image:linear-gradient(180deg,#0B0B0C 0%,#000 100%);
            }
            .staticrypt-spinner { border:0.22em solid rgba(255,255,255,0.25); border-right-color:transparent; }
        </style>
    </head>
